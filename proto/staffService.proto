syntax = "proto3";

message Role {
  int32 id = 1;
  string roleName = 2;
  repeated string privileges = 3;
}

message Profile {
  string image = 2;
  string placeholder = 3;
}

message Staff {
  string id = 1;
  string firstName = 2;
  string lastName = 3;
  string phoneNumber = 4;
  string email = 5;
  Role role = 6;
  Profile profile = 7;
  bool active = 8;
  bool isTenant = 9;
}

message StaffRequest {
  string id = 1;
  string aliasName = 2;
}